<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />

  <!-- Outer Tech Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="16 12" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#cyberGrad)" stroke-width="6" opacity="0.4" />

  <!-- Shield Shape -->
  <path d="M256 100 L370 150 V260 C370 340 320 400 256 424 C192 400 142 340 142 260 V150 Z" 
        fill="#090d16" stroke="url(#cyberGrad)" stroke-width="12" filter="url(#glow)" />

  <!-- Lightning Bolt / Engine Core -->
  <polygon points="275,170 215,265 260,265 237,345 307,245 262,245" 
           fill="url(#cyberGrad)" filter="url(#glow)" />

  <!-- Tech Dots -->
  <circle cx="256" cy="125" r="5" fill="#10b981" />
  <circle cx="350" cy="260" r="5" fill="#06b6d4" />
  <circle cx="162" cy="260" r="5" fill="#06b6d4" />
</svg>
